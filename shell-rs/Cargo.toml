[package]
name = "mosaic-shell"
version = "1.3.0"
edition = "2021"
description = "Mosaic desktop shell for 32-bit and other systems the Qt build cannot target (wry/tao + system web view)"
license = "UNLICENSED"
publish = false

[lib]
name = "mosaic_shell"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "Mosaic"
path = "src/main.rs"

[dependencies]
dirs = "7.0.0"
opener = "0.9.0"
percent-encoding = "2"
png = "0.18.1"
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }
rust-embed = { version = "8.14.0", features = ["debug-embed"] }
serde_json = "1.0.154"
tao = "0.37.2"
tiny_http = "0.12.0"
wry = "0.57.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
